services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_agent
    ports:
      - "5433:5432"  # host:container (use 5433 if 5432 is already in use)
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
